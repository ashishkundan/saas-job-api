name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: saas_job_api
          POSTGRES_PASSWORD: saas_job_api
          POSTGRES_DB: saas_job_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas_job_api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Plain postgresql:// scheme - matches Render's actual connectionString
      # format (see render.yaml) and what db.py's asyncpg pool requires.
      # alembic/env.py normalizes this to the +asyncpg scheme SQLAlchemy's
      # async engine needs; do not use a +asyncpg URL here, it would only
      # test a format production never actually sends.
      SAAS_JOB_API_DATABASE_URL: postgresql://saas_job_api:saas_job_api@localhost:5432/saas_job_api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations against Postgres
        run: alembic upgrade head

      - name: Run tests against the in-memory store
        env:
          SAAS_JOB_API_DATABASE_URL: ""
          SAAS_JOB_API_TEST_DATABASE_URL: ""
        run: pytest -q

      - name: Run tests against Postgres
        env:
          SAAS_JOB_API_TEST_DATABASE_URL: postgresql://saas_job_api:saas_job_api@localhost:5432/saas_job_api
        run: pytest -q
