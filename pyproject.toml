[project]
name = "saas-job-api"
version = "0.1.0"
description = "Reference implementation of the SaaS Job API polled by the Gateway VM Job Poller"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "python-json-logger>=2.0",
    "cryptography>=42,<48",
]

[project.optional-dependencies]
# Installed in the container image so the same image runs `alembic upgrade head`
# (the Azure migration job) before a new revision takes traffic.
migrations = [
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
